<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPC Soundboard</title>
<style>
  :root{
    --bg:#15110d;
    --panel:#1f1812;
    --panel-alt:#241b14;
    --border:#3a2c1e;
    --text:#ecdfc8;
    --text-muted:#9c8b72;
    --accent:#c9862f;
    --accent-bright:#e8a94a;
    --danger:#a13d2e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}

  /* ---------- Control Panel ---------- */
  #control{min-height:100vh;padding:22px 26px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand h1{font-family:Georgia,'Iowan Old Style',serif;font-size:22px;margin:0;letter-spacing:.02em;font-weight:600;}
  .brand span{color:var(--text-muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;}
  .actions{display:flex;gap:10px;flex-wrap:wrap;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;letter-spacing:.01em;transition:transform .1s ease, background .15s ease;}
  button:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent);color:#1a1209;}
  .btn-primary:hover{background:var(--accent-bright);}
  .btn-ghost{background:var(--panel);color:var(--text);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--accent);}
  .btn-danger{background:transparent;color:var(--danger);}
  .hint{font-size:12px;color:var(--text-muted);margin-top:4px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;}
  .card{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:2px solid var(--border);background:var(--panel-alt);cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(0,0,0,.5);}
  .card.active{border-color:var(--accent-bright);box-shadow:0 0 0 3px rgba(232,169,74,.35),0 10px 26px rgba(0,0,0,.6);}
  .card img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.92);}
  .card .plate{position:absolute;left:0;right:0;bottom:0;padding:8px 8px 6px;background:linear-gradient(180deg,rgba(20,15,10,0) 0%,rgba(15,11,8,.94) 60%);font-family:Georgia,serif;font-size:13px;text-align:center;}
  .card .num{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:5px;background:rgba(15,11,8,.7);color:var(--text-muted);font-size:11px;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;}
  .card .del{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(15,11,8,.75);color:var(--text-muted);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;}
  .card:hover .del{opacity:1;}
  .card .del:hover{color:var(--danger);}

  .addcard{border-style:dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text-muted);font-size:13px;}
  .addcard:hover{color:var(--accent-bright);border-color:var(--accent);}
  .addcard .plus{font-size:26px;line-height:1;}

  .empty{padding:60px 10px;text-align:center;color:var(--text-muted);}
  .empty h2{font-family:Georgia,serif;color:var(--text);font-weight:500;font-size:19px;margin-bottom:8px;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(10,7,5,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;width:100%;max-width:340px;}
  .modal h3{font-family:Georgia,serif;margin:0 0 16px;font-size:17px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;}
  .field input[type=text]{width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--border);background:var(--panel-alt);color:var(--text);font-size:14px;}
  .field input[type=file]{color:var(--text-muted);font-size:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .preview{width:80px;height:80px;border-radius:8px;object-fit:cover;border:1px solid var(--border);margin-top:8px;display:none;}

  /* ---------- Display Window ---------- */
  #display{display:none;position:fixed;inset:0;background:radial-gradient(ellipse at center, #1b1510 0%, #000 72%);align-items:center;justify-content:center;overflow:hidden;}
  .idle{color:var(--text-muted);font-family:Georgia,serif;font-style:italic;font-size:15px;letter-spacing:.04em;opacity:.5;transition:opacity .4s ease;}
  .frame{position:relative;opacity:0;transform:scale(.94);transition:opacity .5s ease, transform .5s ease;text-align:center;}
  .frame.show{opacity:1;transform:scale(1);}
  .frame img{max-width:82vw;max-height:72vh;display:block;border-radius:4px;border:6px solid #2a2018;box-shadow:0 0 0 1px rgba(201,134,47,.4), 0 24px 70px rgba(0,0,0,.85), 0 0 90px rgba(201,134,47,.08);}
  .frame .name{margin-top:20px;font-family:Georgia,serif;font-style:italic;font-size:clamp(20px,3vw,38px);letter-spacing:.03em;opacity:0;transform:translateY(6px);transition:opacity .4s ease .22s, transform .4s ease .22s;}
  .frame.show .name{opacity:1;transform:translateY(0);}
  .exit-hint{position:fixed;bottom:14px;right:18px;font-size:11px;color:#5a4f42;letter-spacing:.05em;}
</style>
</head>
<body>

<div id="control">
  <div class="topbar">
    <div class="brand"><h1>NPC Soundboard</h1><span>click a face to cue it on the tv</span></div>
    <div class="actions">
      <button class="btn-primary" id="openDisplayBtn">⧉ Open TV Display</button>
      <button class="btn-ghost" id="hideBtn">Hide</button>
      <button class="btn-ghost" id="addBtn">+ Add NPC</button>
    </div>
  </div>
  <div id="gridWrap"></div>
  <p class="hint" id="fallbackHint" style="display:none;">If the TV window didn't open, open this file/link in a second browser window yourself, then click "Make this the TV display" below.</p>
  <button class="btn-ghost" id="forceDisplayBtn" style="display:none;margin-top:8px;">Make this window the TV display</button>
</div>

<div id="display">
  <div id="idleMsg" class="idle">waiting for cue…</div>
  <div class="frame" id="frame">
    <img id="frameImg" src="" alt="">
    <div class="name" id="frameName"></div>
  </div>
  <div class="exit-hint">press F11 for fullscreen</div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Add an NPC</h3>
    <div class="field">
      <label>Name</label>
      <input type="text" id="npcName" placeholder="e.g. Old Man Brenner">
    </div>
    <div class="field">
      <label>Portrait image</label>
      <input type="file" id="npcFile" accept="image/*">
      <img class="preview" id="npcPreview">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelAdd">Cancel</button>
      <button class="btn-primary" id="confirmAdd">Add</button>
    </div>
  </div>
</div>

<script>
const bc = new BroadcastChannel('npc-soundboard-v1');
let npcs = [];
let activeId = null;
let pendingImg = null;

const controlEl = document.getElementById('control');
const displayEl = document.getElementById('display');
const gridWrap = document.getElementById('gridWrap');
const overlay = document.getElementById('overlay');
const frame = document.getElementById('frame');
const frameImg = document.getElementById('frameImg');
const frameName = document.getElementById('frameName');
const idleMsg = document.getElementById('idleMsg');

// ---------- storage ----------
async function loadRoster(){
  try{
    const r = await window.storage.get('npc-roster', false);
    if(r && r.value) npcs = JSON.parse(r.value);
  }catch(e){ npcs = []; }
}
async function saveRoster(){
  try{ await window.storage.set('npc-roster', JSON.stringify(npcs), false); }
  catch(e){ console.error('save failed', e); }
}

// ---------- image resize ----------
function resizeImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const max = 1000;
        let w = img.width, h = img.height;
        if(w>h && w>max){ h = h*(max/w); w = max; }
        else if(h>=w && h>max){ w = w*(max/h); h = max; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- control rendering ----------
function renderGrid(){
  gridWrap.innerHTML = '';
  if(npcs.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = '<h2>No NPCs yet</h2><p>Add a portrait to start cueing them on the TV.</p>';
    gridWrap.appendChild(empty);
  } else {
    const grid = document.createElement('div');
    grid.className = 'grid';
    npcs.forEach((npc, i)=>{
      const card = document.createElement('div');
      card.className = 'card' + (npc.id === activeId ? ' active' : '');
      card.innerHTML = `
        <span class="num">${i < 9 ? i+1 : ''}</span>
        <img src="${npc.img}" alt="${npc.name}">
        <div class="plate">${npc.name}</div>
        <div class="del" title="remove">✕</div>
      `;
      card.addEventListener('click', (e)=>{
        if(e.target.classList.contains('del')){
          e.stopPropagation();
          deleteNpc(npc.id);
          return;
        }
        toggleShow(npc);
      });
      grid.appendChild(card);
    });
    gridWrap.appendChild(grid);
  }
}

function toggleShow(npc){
  if(activeId === npc.id){
    activeId = null;
    bc.postMessage({type:'hide'});
  } else {
    activeId = npc.id;
    bc.postMessage({type:'show', name: npc.name, img: npc.img});
  }
  renderGrid();
}

function hideAll(){
  activeId = null;
  bc.postMessage({type:'hide'});
  renderGrid();
}

async function deleteNpc(id){
  npcs = npcs.filter(n=>n.id!==id);
  if(activeId===id){ activeId=null; bc.postMessage({type:'hide'}); }
  await saveRoster();
  renderGrid();
}

// ---------- add modal ----------
document.getElementById('addBtn').addEventListener('click', ()=>{
  document.getElementById('npcName').value = '';
  document.getElementById('npcFile').value = '';
  document.getElementById('npcPreview').style.display = 'none';
  pendingImg = null;
  overlay.classList.add('show');
});
document.getElementById('cancelAdd').addEventListener('click', ()=> overlay.classList.remove('show'));

document.getElementById('npcFile').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  pendingImg = await resizeImage(file);
  const prev = document.getElementById('npcPreview');
  prev.src = pendingImg;
  prev.style.display = 'block';
});

document.getElementById('confirmAdd').addEventListener('click', async ()=>{
  const name = document.getElementById('npcName').value.trim();
  if(!name || !pendingImg){
    alert('Give the NPC a name and pick a portrait image.');
    return;
  }
  npcs.push({ id: Date.now().toString(36), name, img: pendingImg });
  await saveRoster();
  renderGrid();
  overlay.classList.remove('show');
});

document.getElementById('hideBtn').addEventListener('click', hideAll);

// ---------- launching the TV display window ----------
document.getElementById('openDisplayBtn').addEventListener('click', ()=>{
  const url = new URL(window.location.href);
  url.searchParams.set('role','display');
  const win = window.open(url.toString(), '_blank');
  if(!win){
    document.getElementById('fallbackHint').style.display='block';
    document.getElementById('forceDisplayBtn').style.display='inline-block';
  }
});
document.getElementById('forceDisplayBtn').addEventListener('click', enterDisplayMode);

// keyboard shortcuts on control panel: 1-9 to cue, Esc to hide
document.addEventListener('keydown', (e)=>{
  if(controlEl.style.display === 'none') return;
  if(e.key === 'Escape'){ hideAll(); return; }
  const n = parseInt(e.key,10);
  if(!isNaN(n) && n>=1 && n<=9 && npcs[n-1]) toggleShow(npcs[n-1]);
});

// ---------- display mode ----------
function enterDisplayMode(){
  controlEl.style.display = 'none';
  displayEl.style.display = 'flex';
  document.title = 'NPC Display';
}

bc.onmessage = (e)=>{
  const msg = e.data;
  if(displayEl.style.display !== 'flex') return;
  if(msg.type === 'show'){
    idleMsg.style.opacity = '0';
    frameImg.src = msg.img;
    frameName.textContent = msg.name;
    frame.classList.add('show');
  } else if(msg.type === 'hide'){
    frame.classList.remove('show');
    idleMsg.style.opacity = '.5';
  }
};

// ---------- init ----------
(async function init(){
  const params = new URLSearchParams(window.location.search);
  if(params.get('role') === 'display'){
    enterDisplayMode();
  } else {
    await loadRoster();
    renderGrid();
  }
})();
</script>
</body>
</html>
